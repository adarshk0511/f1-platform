name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  gateway:
    name: Gateway CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci


  auth-service:
    name: Auth Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      

  driver-service:
    name: Driver Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/driver-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/driver-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      

  job-service:
    name: Job Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/job-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/job-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      