apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: f1-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: f1-platform-auth-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: auth-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_SECRET

            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: REFRESH_TOKEN_SECRET

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: API_KEY

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: f1-platform

spec:
  type: ClusterIP

  selector:
    app: auth-service

  ports:
    - port: 5001
      targetPort: 5001