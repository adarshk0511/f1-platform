apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: driver-service
  namespace: f1-platform

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driver-service

  minReplicas: 1
  maxReplicas: 1

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60