apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: f1-platform
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: f1-platform-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: gateway-config

          env:
            - name: GATEWAY_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: GATEWAY_INTERNAL_KEY

            - name: JOB_SERVICE_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: JOB_SERVICE_INTERNAL_KEY

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: f1-platform
spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080