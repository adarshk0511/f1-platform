apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "4"
  creationTimestamp: "2026-08-29T07:05:11Z"
  generation: 4
  labels:
    app: driver-service
  name: driver-service
  namespace: f1-platform

spec:
  progressDeadlineSeconds: 600
  replicas: 3
  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: driver-service

  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  template:
    metadata:
      creationTimestamp: null
      labels:
        app: driver-service

    spec:
      containers:
        - env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  key: REDIS_HOST
                  name: driver-config

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  key: REDIS_PORT
                  name: driver-config

            - name: JOB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  key: JOB_SERVICE_URL
                  name: driver-config

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  key: MONGO_URI
                  name: driver-config

            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_SERVICE_KEY
                  name: f1-service-secrets

          image: f1-platform-driver-service
          imagePullPolicy: IfNotPresent
          name: f1-platform-driver-service

          ports:
            - containerPort: 5002

          # Kubernetes asks:
          # "Is the application alive?"
          # If this continuously fails, Kubernetes restarts the container.
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10

          # Kubernetes asks:
          # "Can this Pod receive traffic?"
          # If this fails, the Pod is removed from Service endpoints.
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5

          resources: {}

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30